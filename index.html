
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot tuyển sinh Đại học ABC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <h2>Chatbot tuyển sinh ABC</h2>
            <p>Trợ lý tư vấn tuyển sinh trực tuyến 24/7</p>
        </header>

        <div id="chat-box">
            <div class="message bot">
                Xin chào! Tôi là chatbot tư vấn tuyển sinh Đại học ABC.
                Bạn muốn tìm hiểu về ngành học, học phí, học bổng hay phương thức xét tuyển?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input"
                   placeholder="Nhập câu hỏi của bạn...">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
